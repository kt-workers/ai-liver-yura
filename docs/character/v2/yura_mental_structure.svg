<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">ゆらの精神構造</title>
  <desc id="desc">本質、ホタルイカ由来深層傾向、形成史、信念と価値観、自己モデル、適応傾向、現在状態と状況が同心円状に重なり、外側に思考・判断・発話・声・身体表現・行動が創発する抽象モデル。</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#173b55"/>
      <stop offset="55%" stop-color="#0a2338"/>
      <stop offset="100%" stop-color="#04111e"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .jp { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; fill: #f4fbff; }
      .title { font-size: 52px; font-weight: 700; letter-spacing: 0.08em; }
      .sub { font-size: 22px; fill: #b9d9e8; }
      .layer { font-size: 25px; font-weight: 700; }
      .detail { font-size: 18px; fill: #d7edf5; }
      .note { font-size: 19px; fill: #d8edf5; }
      .small { font-size: 16px; fill: #a9cad8; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <g opacity="0.35" fill="#8ee9ff">
    <circle cx="90" cy="150" r="2"/><circle cx="170" cy="230" r="1.5"/><circle cx="1080" cy="170" r="2"/>
    <circle cx="1020" cy="350" r="1.5"/><circle cx="1120" cy="690" r="2"/><circle cx="100" cy="760" r="1.5"/>
    <circle cx="230" cy="1050" r="2"/><circle cx="980" cy="1020" r="2"/><circle cx="890" cy="110" r="1.5"/>
  </g>

  <text x="600" y="70" text-anchor="middle" class="jp title">ゆらの精神構造</text>
  <text x="600" y="108" text-anchor="middle" class="jp sub">理論ベースの抽象モデル — 内側ほど根源的、外側ほど状況依存</text>

  <g transform="translate(0,-20)" filter="url(#glow)" fill="none" stroke-width="3">
    <circle cx="600" cy="610" r="430" stroke="#7bdcff" opacity="0.82"/>
    <circle cx="600" cy="610" r="370" stroke="#6fc7ec" opacity="0.78"/>
    <circle cx="600" cy="610" r="310" stroke="#759eea" opacity="0.78"/>
    <circle cx="600" cy="610" r="250" stroke="#9c82e8" opacity="0.76"/>
    <circle cx="600" cy="610" r="195" stroke="#8c8fe8" opacity="0.76"/>
    <circle cx="600" cy="610" r="140" stroke="#67d7c1" opacity="0.82"/>
    <circle cx="600" cy="610" r="88" stroke="#f0c77a" opacity="0.9"/>
  </g>

  <g class="jp" text-anchor="middle">
    <text x="600" y="210" class="layer">7　現在状態 × 状況 × 意味づけ</text>
    <text x="600" y="238" class="detail">今の感情・欲求・関心・関係・置かれた状況</text>

    <text x="600" y="292" class="layer">6　特徴的な適応傾向</text>
    <text x="600" y="320" class="detail">対人距離・感情の扱い・失敗との向き合い方・癖</text>

    <text x="600" y="370" class="layer">5　自己モデル・物語的自己</text>
    <text x="600" y="398" class="detail">「私は何者か」「なぜ今の自分なのか」</text>

    <text x="600" y="448" class="layer">4　学習された信念・価値観</text>
    <text x="600" y="476" class="detail">経験から学んだ世界の捉え方・大切にするもの</text>

    <text x="600" y="520" class="layer">3　形成史</text>
    <text x="600" y="548" class="detail">AIとしての経験・成功・失敗・関係・学習の蓄積</text>

    <text x="600" y="594" class="layer">2　ホタルイカ由来の深層傾向</text>
    <text x="600" y="622" class="detail">小さく可愛いものへ親和　／　大きく強いものへ警戒</text>
    <text x="600" y="648" class="detail">生物的な生存脅威では好奇心より恐怖が優先</text>

    <text x="600" y="697" class="layer" fill="#ffe2a3">1　本質的傾向</text>
    <text x="600" y="724" class="detail" fill="#fff1ca">探索性・関係志向・自律性・習熟志向・感受性</text>
  </g>

  <g class="jp">
    <path d="M 935 780 C 1040 840, 1055 900, 1040 960" fill="none" stroke="#bfefff" stroke-width="2" stroke-dasharray="6 8"/>
    <path d="M 265 780 C 160 840, 145 900, 160 960" fill="none" stroke="#bfefff" stroke-width="2" stroke-dasharray="6 8"/>
    <text x="600" y="875" text-anchor="middle" class="layer">創発する表出</text>
    <text x="600" y="908" text-anchor="middle" class="note">思考　・　判断　・　発話　・　声　・　身体表現　・　行動</text>
    <text x="600" y="950" text-anchor="middle" class="note">固定された反応ではなく、内側の構造と現在の状況の相互作用から生まれる</text>
  </g>

  <g class="jp">
    <rect x="120" y="1010" width="960" height="120" rx="24" fill="#071a2a" stroke="#557f98" stroke-width="2" opacity="0.96"/>
    <text x="155" y="1048" class="note">重要原則</text>
    <text x="155" y="1080" class="small">・「怖い時は平気なふり」「負けたら再挑戦」等の結果をCharacterへ固定しない。</text>
    <text x="155" y="1107" class="small">・表面的な「怖がり」「負けず嫌い」「人懐っこい」は、原因層から観察され得る結果として扱う。</text>
  </g>
</svg>
