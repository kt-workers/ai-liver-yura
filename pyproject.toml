[project]
name = "ai-liver"
version = "0.1.0"
description = "Activity-driven modular AI liver agent"
requires-python = ">=3.10,<3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: 外部I/Oや実時間待機を伴わない高速な単体テスト",
    "integration: 複数コンポーネント間の接続を検証する統合テスト",
    "slow: 実時間待機、スレッド待機、長時間処理を伴う低速テスト",
    "external: DB、HTTP、外部サービスなど実環境依存を伴うテスト",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "."
