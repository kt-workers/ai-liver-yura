<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yura System Architecture</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">Y</div>
        <div><strong>System Explorer</strong><span>ゆらの構造を見渡す</span></div>
      </div>
      <section><h2>検索</h2><input id="search" type="search" placeholder="モジュール名・パス..."></section>
      <section><h2>カテゴリ</h2><select id="categoryFilter"><option value="all">すべて</option></select></section>
      <section class="summary" id="summary"></section>
      <section><h2>凡例</h2><div id="legend" class="legend"></div></section>
    </aside>

    <main class="workspace">
      <header class="toolbar">
        <div><h1>システム構成図</h1><p id="generatedAt">読み込み中...</p></div>
        <div class="toolbar-actions"><button id="fitButton" type="button">全体表示</button><button id="reloadButton" type="button">再解析</button></div>
      </header>
      <div id="canvasWrap" class="canvas-wrap">
        <svg id="graph" aria-label="システムモジュール依存関係図">
          <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" class="arrow-head"></path></marker></defs>
          <g id="viewport"><g id="lanes"></g><g id="edges"></g><g id="nodes"></g></g>
        </svg>
        <div id="loading" class="loading">依存関係を解析しています…</div>
        <div class="zoom-help">ホイール: 拡大縮小 / ドラッグ: 移動 / ノード選択: 関係を強調</div>
      </div>
    </main>

    <aside class="detail-panel">
      <div id="emptyDetail" class="empty-detail"><div class="empty-icon">↗</div><h2>モジュールを選択</h2><p>ノードをクリックすると依存元・依存先とファイル情報を表示します。</p></div>
      <div id="detail" hidden>
        <div class="detail-heading"><div><span id="detailCategory" class="category-pill"></span><h2 id="detailLabel"></h2><code id="detailId"></code></div><button id="closeDetail" class="icon-button" type="button">×</button></div>
        <dl class="facts"><div><dt>Path</dt><dd id="detailPath"></dd></div><div><dt>Python files</dt><dd id="detailFilesCount"></dd></div><div><dt>Inputs</dt><dd id="detailIncomingCount"></dd></div><div><dt>Outputs</dt><dd id="detailOutgoingCount"></dd></div></dl>
        <section><h3>依存先</h3><div id="outgoingList" class="relation-list"></div></section>
        <section><h3>依存元</h3><div id="incomingList" class="relation-list"></div></section>
        <section><h3>Files</h3><div id="fileList" class="file-list"></div></section>
      </div>
    </aside>
  </div>
  <script src="/static/app.js" defer></script>
</body>
</html>
