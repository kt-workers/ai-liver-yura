services:
  - type: web
    name: yura-input-meaning-lab
    runtime: python
    plan: free
    branch: test/input-meaning-cloud-validation
    buildCommand: python -m pip install -r requirements.txt
    startCommand: >-
      python -m uvicorn cloud_validation.input_meaning_lab:app
      --host 0.0.0.0
      --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.20
      - key: YURA_INPUT_MEANING_LAB_MODE
        value: live
      - key: YURA_INPUT_MEANING_LAB_TIMEOUT_SECONDS
        value: "45"
      - key: YURA_INPUT_MEANING_LAB_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: YURA_LAB_USERNAME
        sync: false
      - key: YURA_LAB_PASSWORD
        sync: false
