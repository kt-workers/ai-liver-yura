response_generator:
  type: llm
  model: openai_chat
  fallback_response: うまく言葉が出てこなかったみたい。もう一度話しかけてね。

# LLMの責務ごとにモデルと失敗時の扱いを明示する。
# modelは上のmodelsキーを参照し、Providerはmodels.<key>.serviceから解決する。
llm_roles:
  situation_evaluator:
    model: openai_chat
    temperature: 0.1
    timeout_seconds: 30.0
    fallback_response: '{"activity_type":"conversation","operation":"discuss","goal":"通常会話で応答する","constraints":{},"speech_act":"statement","negated":false,"hypothetical":false,"past_reference":false,"knowledge_question":false,"confidence":0.0,"reason":"evaluation_failed"}'
  character:
    model: openai_chat
    temperature: 0.7
    timeout_seconds: 60.0
    fallback_response: '{"speech":"うまく言葉にできなかったみたい。もう一度話しかけてね。","expression":"soft_smile","gesture":null,"claims":["conversation_only"]}'
  response_validator:
    model: openai_chat
    temperature: 0.0
    timeout_seconds: 30.0
    fallback_response: '{"accepted":false,"reason":"validation_failed"}'

topic_classifier:
  model: openai_chat

# 配信準備は状態確認だけを行い、OBS開始やYouTube遷移は行わない。
streaming:
  health_timeout_seconds: 60.0
  readiness:
    require_youtube: true
    require_obs: true
    require_tts: false
    require_avatar: false
    require_run_of_show: true
    require_emergency_stop: false
    allow_required_degraded: false
    require_live_chat: false
  obs:
    expected_scene_collection: AI Liver
    expected_start_scene: Starting Soon
    required_audio_sources: []
    optional_audio_sources: []
    avatar_source_name: Yura
    require_avatar_source_visible: false
    low_volume_threshold_db: -60.0
    max_scene_depth: 8
  run_of_show:
    directory: config/run_of_show
    default_id: default
  fake:
    broadcast_id: fake-broadcast-1
    broadcast_title: 配信準備テスト枠
  moderation:
    blocked_terms: []
    allowed_terms: []
    max_comment_length: 300
    repeated_message_window_seconds: 30
    repeated_message_limit: 3
    url_policy: review
    unknown_message_type_policy: ignore
    max_concurrent_evaluations: 4
    evaluation_queue_capacity: 128
    timeout_seconds: 3.0
  comment_ranking:
    weights:
      recency: 0.15
      relevance: 0.25
      novelty: 0.15
      conversation_fit: 0.20
      engagement: 0.15
      fairness: 0.10
    selection_threshold: 0.55
    minimum_conversation_fit: 0.5
    candidate_ttl_seconds: 90
    reservation_ttl_seconds: 30
    max_pool_size: 200
    max_rank_batch_size: 50
    history_size: 100
    author_cooldown_count: 2
    semantic_timeout_seconds: 2.0
    max_concurrent_rankings: 1
    queue_capacity: 16
  comment_response:
    max_characters: 140
    max_sentences: 3
    allow_follow_up_question: true
    mention_author_name: optional
    repeat_comment_text: false
    response_cooldown_seconds: 5
    max_retries: 2

plugins:
  registry: {}
  games:
    enabled: true
    intent_interpreter:
      enabled: true
      model: openai_chat
      confidence_threshold: 0.85
      max_attempts: 2
    shiritori:
      enabled: true
      max_generation_retries: 3
