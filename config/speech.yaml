speech:
  enabled: true
  service: voicevox
  pronunciation_dictionary_path: config/pronunciation_dictionary.yaml
  # Voidoll（ノーマル）
  speaker_id: 89
  default_profile: neutral
  voice_intent_profiles:
    # Voidoll公式推奨値を基準にする
    neutral:
      speed_scale: 0.90
      pitch_scale: 0.03
      intonation_scale: 0.90
      volume_scale: 1.0
    bright:
      speed_scale: 1.02
      pitch_scale: 0.05
      intonation_scale: 1.08
      volume_scale: 1.03
    energetic:
      speed_scale: 1.15
      pitch_scale: 0.07
      intonation_scale: 1.20
      volume_scale: 1.08
    restrained_anger:
      speed_scale: 1.08
      pitch_scale: 0.01
      intonation_scale: 1.15
      volume_scale: 1.10
    subdued:
      speed_scale: 0.78
      pitch_scale: -0.02
      intonation_scale: 0.72
      volume_scale: 0.88
    weary:
      speed_scale: 0.72
      pitch_scale: -0.03
      intonation_scale: 0.68
      volume_scale: 0.82
  player:
    type: system
    # nullの場合、macOSはafplay、Linuxはaplayを使用する
    command: null
