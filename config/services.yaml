# 外部サービスの接続情報はここで一元管理する。
# APIキーやDSNの値自体は記載せず、環境変数名だけを指定する。
services:
  openai:
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 60.0
  ollama:
    type: ollama
    base_url: http://localhost:11434
    timeout_seconds: 60.0
  voicevox:
    type: voicevox
    base_url: http://192.168.50.182:50021
    timeout_seconds: 30.0
  topic_memory_database:
    type: postgres
    dsn_env: AI_LIVER_DATABASE_URL
