name: Python tests

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: python-tests-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply user input event logger refactor
        if: github.event_name == 'pull_request' && github.head_ref == 'refactor/user-input-event-logger'
        run: |
          python scripts/apply_user_input_event_logger_refactor.py
          if ! git diff --quiet; then
            git config user.name "ch4t9pt"
            git config user.email "308621972+ch4t9pt@users.noreply.github.com"
            git add app/runtime/runtime_coordinator.py
            git commit -m "RuntimeCoordinatorのユーザー入力ログを分離"
            git push origin HEAD:refactor/user-input-event-logger
          fi

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: pytest -q
