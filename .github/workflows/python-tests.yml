name: Python tests

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: python-tests-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Restore asdict import
        if: github.event_name == 'pull_request' && github.head_ref == 'refactor/runtime-diagnostic-snapshot'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/runtime/runtime_coordinator.py')
          text = path.read_text(encoding='utf-8')
          old = 'from dataclasses import replace\n'
          new = 'from dataclasses import asdict, replace\n'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          rm -f ci-first-failure.txt
          if ! git diff --quiet; then
            git config user.name "ch4t9pt"
            git config user.email "308621972+ch4t9pt@users.noreply.github.com"
            git add app/runtime/runtime_coordinator.py ci-first-failure.txt
            git commit -m "RuntimeCoordinatorのasdict importを復元"
            git push origin HEAD:refactor/runtime-diagnostic-snapshot
          fi

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: pytest -q
