name: Python tests

on:
  pull_request:
    branches:
      - feature/core-development

permissions:
  contents: write

jobs:
  update-test:
    if: github.head_ref == 'refactor/integrate-emotion-appraisal-config'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update obsolete reserved-key test and restore CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test = Path('tests/test_multi_file_config_loader.py')
          text = test.read_text(encoding='utf-8')
          obsolete = '''        (
              {"imports": {"emotion_appraisal": "emotion.yaml"}},
              "imports.emotion_appraisal",
          ),
'''
          if obsolete not in text:
              raise SystemExit('obsolete emotion_appraisal reserved-key case not found')
          test.write_text(text.replace(obsolete, '', 1), encoding='utf-8')

          Path('.github/workflows/python-tests.yml').write_text('''name: Python tests

on:
  pull_request:
    branches:
      - feature/core-development
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: pytest -x -vv
