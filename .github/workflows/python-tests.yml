name: Python tests

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: python-tests-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q --upgrade pip
          python -m pip install -q -r requirements.txt
          python -m pip install -q -r requirements-dev.txt

      - name: Capture first failure
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -f ci-first-failure.txt ]; then
            cat ci-first-failure.txt
            exit 1
          fi
          set +e
          pytest -q --maxfail=1 > ci-first-failure.txt 2>&1
          status=$?
          set -e
          cat ci-first-failure.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "ch4t9pt"
            git config user.email "308621972+ch4t9pt@users.noreply.github.com"
            git add ci-first-failure.txt
            git commit -m "CIの最初の失敗内容を一時保存"
            git push origin HEAD:refactor/runtime-diagnostic-snapshot
          fi
          exit "$status"
