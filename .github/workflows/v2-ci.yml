name: V2 Deterministic CI

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact Pull Request number to validate
        required: true
        type: string
      expected_head_sha:
        description: Exact live PR head SHA expected for this dispatch
        required: true
        type: string
  pull_request:
    branches:
      - rebuild/v2-foundation
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: v2-ci-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIPENV_VERSION: "2026.8.0"

jobs:
  resolve-pr-identity:
    name: resolve-pr-identity
    runs-on: ubuntu-24.04
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      live_base_sha: ${{ steps.resolve.outputs.live_base_sha }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_DISPATCH_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$PR_NUMBER"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          base_ref="$(jq -r '.base.ref' <<<"$pr")"
          test "$base_ref" = "rebuild/v2-foundation"
          test "$head_sha" != "null"
          live_base_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$base_ref" --jq '.object.sha')"
          test -n "$live_base_sha"
          test "$live_base_sha" != "null"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$head_sha" = "$EVENT_HEAD_SHA"
          else
            test -n "$EXPECTED_DISPATCH_HEAD_SHA"
            test "$head_sha" = "$EXPECTED_DISPATCH_HEAD_SHA"
          fi
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$head_sha"
            echo "base_ref=$base_ref"
            echo "live_base_sha=$live_base_sha"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: quality
    needs: resolve-pr-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout resolved exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-pr-identity.outputs.head_sha }}
          fetch-depth: 0

      - name: Verify live base generation and freshness
        env:
          BASE_REF: ${{ needs.resolve-pr-identity.outputs.base_ref }}
          LIVE_BASE_SHA: ${{ needs.resolve-pr-identity.outputs.live_base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve-pr-identity.outputs.head_sha }}
        run: |
          git fetch --no-tags origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fetched_base_sha="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
          test "$fetched_base_sha" = "$LIVE_BASE_SHA"
          git merge-base --is-ancestor "$LIVE_BASE_SHA" "$EXPECTED_HEAD_SHA"

      - name: Set up Python from repository contract
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: Pipfile.lock

      - name: Verify dependency source invariant
        run: |
          test -f Pipfile
          test -f Pipfile.lock
          test ! -e requirements.txt
          test ! -e requirements-dev.txt

      - name: Install dependencies from Pipfile.lock
        run: |
          python -m pip install "pipenv==$PIPENV_VERSION"
          python -m pipenv install --system --deploy --dev

      - name: Verify exact head identity
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve-pr-identity.outputs.head_sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          python --version
          python -m pip --version
          python -m pip freeze

      - name: Ruff
        run: python -m ruff check app tests

      - name: Mypy strict
        run: python -m mypy --strict app tests

      - name: Pytest full suite
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Check diff whitespace against live base
        env:
          LIVE_BASE_SHA: ${{ needs.resolve-pr-identity.outputs.live_base_sha }}
          HEAD_SHA: ${{ needs.resolve-pr-identity.outputs.head_sha }}
        run: git diff --check "$LIVE_BASE_SHA...$HEAD_SHA"

      - name: Verify base generation remained stable
        env:
          BASE_REF: ${{ needs.resolve-pr-identity.outputs.base_ref }}
          LIVE_BASE_SHA: ${{ needs.resolve-pr-identity.outputs.live_base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_base_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_REF" --jq '.object.sha')"
          test "$current_base_sha" = "$LIVE_BASE_SHA"
