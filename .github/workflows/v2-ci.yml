name: V2 Deterministic CI

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 検証対象のPR番号
        required: true
        type: string
      expected_head_sha:
        description: 今回の実行で期待する現在のPR先端SHA
        required: true
        type: string
  pull_request:
    branches:
      - rebuild/v2-foundation
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: v2-ci-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  TZ: UTC
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIPENV_VERSION: "2026.8.0"
  PIPENV_DONT_LOAD_ENV: "1"

jobs:
  resolve-pr-identity:
    name: resolve-pr-identity
    runs-on: ubuntu-24.04
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      live_base_sha: ${{ steps.resolve.outputs.live_base_sha }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_DISPATCH_HEAD_SHA: ${{ inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$PR_NUMBER"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          base_ref="$(jq -r '.base.ref' <<<"$pr")"
          test "$base_ref" = "rebuild/v2-foundation"
          test "$head_sha" != "null"
          live_base_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$base_ref" --jq '.object.sha')"
          test -n "$live_base_sha"
          test "$live_base_sha" != "null"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$head_sha" = "$EVENT_HEAD_SHA"
          else
            test -n "$EXPECTED_DISPATCH_HEAD_SHA"
            test "$head_sha" = "$EXPECTED_DISPATCH_HEAD_SHA"
          fi
          {
            echo "pr_number=$PR_NUMBER"
            echo "head_sha=$head_sha"
            echo "base_ref=$base_ref"
            echo "live_base_sha=$live_base_sha"
          } >> "$GITHUB_OUTPUT"

  quality:
    name: quality
    needs: resolve-pr-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_USER: yura_test
          # このCI内で作成・削除する隔離DBだけの固定認証値。
          POSTGRES_PASSWORD: isolated-test-no-auth
          POSTGRES_DB: postgres
        ports:
          - 58439:5432
        options: >-
          --health-cmd "pg_isready -U yura_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      YURA_TEST_POSTGRES_HOST: "127.0.0.1"
      YURA_TEST_POSTGRES_PORT: "58439"
      YURA_TEST_POSTGRES_USER: yura_test
      YURA_REQUIRE_POSTGRES: "1"

    steps:
      - name: 照合済みのPR先端を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-pr-identity.outputs.head_sha }}
          fetch-depth: 0

      - name: 現在の本流のリビジョンと包含を確認
        env:
          BASE_REF: ${{ needs.resolve-pr-identity.outputs.base_ref }}
          LIVE_BASE_SHA: ${{ needs.resolve-pr-identity.outputs.live_base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.resolve-pr-identity.outputs.head_sha }}
        run: |
          git fetch --no-tags origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          fetched_base_sha="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
          test "$fetched_base_sha" = "$LIVE_BASE_SHA"
          git merge-base --is-ancestor "$LIVE_BASE_SHA" "$EXPECTED_HEAD_SHA"

      - name: リポジトリ指定のPythonを準備
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: Pipfile.lock

      - name: 依存管理の正本を確認
        run: |
          test -f Pipfile
          test -f Pipfile.lock
          test ! -e requirements.txt
          test ! -e requirements-dev.txt

      - name: Pipfile.lockから依存を導入
        run: |
          python -m pip install "pipenv==$PIPENV_VERSION"
          python -m pipenv install --system --deploy --dev

      - name: 対象HEADの一致を確認
        env:
          EXPECTED_HEAD_SHA: ${{ needs.resolve-pr-identity.outputs.head_sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD_SHA"
          python --version
          python -m pip --version
          python -m pip freeze

      - name: Ruffによる静的検査
        run: python -m ruff check app tests

      - name: Mypyによる厳格型検査
        run: python -m mypy --strict app tests

      - name: 実PostgreSQLを含む全試験
        run: python -m pytest -q

      - name: Pythonコードをコンパイル
        run: python -m compileall -q app tests

      - name: 現在の本流との差分の空白を検査
        env:
          LIVE_BASE_SHA: ${{ needs.resolve-pr-identity.outputs.live_base_sha }}
          HEAD_SHA: ${{ needs.resolve-pr-identity.outputs.head_sha }}
        run: git diff --check "$LIVE_BASE_SHA...$HEAD_SHA"

      - name: 実行中に本流のリビジョンが変わっていないことを確認
        env:
          BASE_REF: ${{ needs.resolve-pr-identity.outputs.base_ref }}
          LIVE_BASE_SHA: ${{ needs.resolve-pr-identity.outputs.live_base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_base_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_REF" --jq '.object.sha')"
          test "$current_base_sha" = "$LIVE_BASE_SHA"
