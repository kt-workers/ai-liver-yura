name: Cloud internal directive validation

on:
  push:
    branches:
      - test/internal-directive-cloud-validation
  pull_request:
    branches:
      - test/input-meaning-cloud-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    cloud-internal-directive-${{ github.event_name }}-${{
    github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          from cloud_validation.internal_directive_lab_reviewed import (
              _REVIEWED_INDEX_HTML,
          )

          scripts = re.findall(
              r"<script[^>]*>(.*?)</script>",
              _REVIEWED_INDEX_HTML,
              flags=re.DOTALL,
          )
          if not scripts:
              raise RuntimeError("検査対象のJavaScriptが見つかりません")
          for index, script in enumerate(scripts, start=1):
              Path(f"/tmp/internal-directive-lab-{index}.js").write_text(
                  script,
                  encoding="utf-8",
              )
          print(f"extracted {len(scripts)} scripts")
          PY
          for script in /tmp/internal-directive-lab-*.js; do
            node --check "$script"
          done

      - name: Run cloud validation tests
        env:
          YURA_INTERNAL_DIRECTIVE_LAB_MODE: fake
          YURA_LAB_USERNAME: test-user
          YURA_LAB_PASSWORD: test-password
        run: |
          pytest -q \
            tests/test_cloud_internal_directive_lab.py \
            tests/test_cloud_internal_directive_reviewed_lab.py \
            tests/test_cloud_internal_directive_blueprint.py \
            tests/test_input_meaning_directive_separation.py \
            tests/test_internal_directive_runtime_guards.py \
            tests/test_internal_directive_impossible_experience_boundary.py \
            tests/test_internal_directive_impossible_experience_boundary_smoke.py \
            tests/test_internal_directive_interest_gap_guidance.py \
            tests/test_internal_directive_current_feeling_guidance.py
