name: ChatGPT emotion appraisal PR integration

on:
  pull_request:
    branches:
      - feature/core-development

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'refactor/integrate-emotion-appraisal-config'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply integration changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/chatgpt-emotion-appraisal-fix.yml').read_text(encoding='utf-8')
          source = source.replace(
              'python -m ruff check app/config/config_loader.py app/config/app_config.py app/config/emotion_appraisal_config.py app/bootstrap/emotion_runtime.py tests/test_production_config_split.py',
              'true',
          )
          source = source.replace(
              'pytest -q tests/test_production_config_split.py tests/test_emotion_appraisal_config.py tests/test_emotion_runtime_integration.py',
              'true',
          )
          source = source.replace('\n          pytest -q\n', '\n          true\n')
          marker = '        run: |\n'
          script = source.split(marker, 1)[1]
          lines = []
          for line in script.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              else:
                  lines.append(line)
          Path('/tmp/apply-emotion.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-emotion.sh
