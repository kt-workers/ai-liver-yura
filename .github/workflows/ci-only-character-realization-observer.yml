name: CI-only Full Regression Bisect

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bisect:
    name: semantic separated diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: semantic files
        if: always()
        run: |
          files=$(find tests -type f -name 'test_semantic*.py' | sort)
          test -z "$files" || pytest -x -q $files
      - name: separated files
        if: always()
        run: |
          files=$(find tests -type f -name 'test_separated*.py' | sort)
          test -z "$files" || pytest -x -q $files
      - name: other sa-sf files
        if: always()
        run: |
          files=$(find tests -type f -name 'test_s*.py' | sort | grep -Ev '/test_(semantic|separated)' | awk -F/ '{n=$NF; c=substr(n,7,1); if (c >= "a" && c <= "f") print $0}')
          test -z "$files" || pytest -x -q $files
