name: CI-only Full Regression Bisect
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: semantic p
        if: always()
        run: |
          files=$(find tests -type f -name 'test_semantic_p*.py' | sort); test -z "$files" || pytest -x -q $files
      - name: semantic r
        if: always()
        run: |
          files=$(find tests -type f -name 'test_semantic_r*.py' | sort); test -z "$files" || pytest -x -q $files
      - name: semantic s
        if: always()
        run: |
          files=$(find tests -type f -name 'test_semantic_s*.py' | sort); test -z "$files" || pytest -x -q $files
      - name: semantic other n-s
        if: always()
        run: |
          files=$(find tests -type f -name 'test_semantic*.py' | sort | grep -Ev '/test_semantic_(character|utterance|p|r|s)' | awk -F/ '{n=$NF; c=substr(n,15,1); if (c >= "n" && c <= "s") print $0}'); test -z "$files" || pytest -x -q $files
