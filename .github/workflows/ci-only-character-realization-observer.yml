name: CI-only Full Regression Bisect

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bisect:
    name: full regression s-z diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Tests s
        if: always()
        run: |
          files=$(find tests -type f -name 'test_s*.py' | sort)
          test -z "$files" || pytest -x -q $files
      - name: Tests t
        if: always()
        run: |
          files=$(find tests -type f -name 'test_t*.py' | sort)
          test -z "$files" || pytest -x -q $files
      - name: Tests u-z
        if: always()
        run: |
          files=$(find tests -type f -name 'test_*.py' | sort | awk -F/ '{n=$NF; c=substr(n,6,1); if (c >= "u" && c <= "z") print $0}')
          test -z "$files" || pytest -x -q $files
