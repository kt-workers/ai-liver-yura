name: Runtime event executor diagnostic

on:
  pull_request:
    branches:
      - feature/core-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Run focused tests
        run: pytest -x -vv tests/test_runtime_event_executor.py --junitxml=runtime-event-executor-junit.xml
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-event-executor-junit
          path: runtime-event-executor-junit.xml
