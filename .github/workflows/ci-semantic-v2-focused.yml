name: CI-only Semantic v2 focused

on:
  push:
    branches:
      - test/ci-semantic-realization-verifier-v2

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Run standard pytest command
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: pytest -x -vv --junitxml=/tmp/standard.xml
      - name: Emit standard failure
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('/tmp/standard.xml')
          if not path.exists():
              print('::error file=.github,title=standard::junit xml missing')
              raise SystemExit(0)
          root = ET.parse(path).getroot()
          total = failures = 0
          for case in root.iter('testcase'):
              total += 1
              nodes = list(case.findall('failure')) + list(case.findall('error'))
              for node in nodes:
                  failures += 1
                  file = case.attrib.get('file') or '.github'
                  name = f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}"
                  message = (node.attrib.get('message') or node.text or '').replace('\n',' ')[:2800]
                  print(f'::error file={file},line=1,title=standard:{name}::{message}')
          print(f'standard_total={total} failures={failures}')
          PY
