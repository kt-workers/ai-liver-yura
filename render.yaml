services:
  - type: web
    name: yura-inner-state-visualizer
    runtime: python
    plan: free
    branch: feature/gui-development
    buildCommand: python -m compileall app gui/yura-inner-state-visualizer
    startCommand: python gui/yura-inner-state-visualizer/render_server.py
    healthCheckPath: /state
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.5
      - key: YURA_DEMO_INTERVAL_SECONDS
        value: "1.0"

  - type: web
    name: yura-configuration-harbor
    runtime: python
    plan: free
    branch: feature/configuration-harbor
    buildCommand: python -m compileall gui/yura-config-console
    startCommand: python gui/yura-config-console/server.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.5
      - key: YURA_CONFIG_CONSOLE_DATA
        value: /tmp/yura-config-console

  - type: web
    name: yura-input-meaning-lab
    runtime: python
    plan: free
    branch: test/input-meaning-cloud-validation
    buildCommand: python -m pip install -r requirements.txt
    startCommand: >-
      python -m uvicorn cloud_validation.input_meaning_lab:app
      --host 0.0.0.0
      --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.20
      - key: YURA_INPUT_MEANING_LAB_MODE
        value: live
      - key: YURA_INPUT_MEANING_LAB_TIMEOUT_SECONDS
        value: "45"
      - key: YURA_INPUT_MEANING_LAB_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: YURA_LAB_USERNAME
        sync: false
      - key: YURA_LAB_PASSWORD
        sync: false
